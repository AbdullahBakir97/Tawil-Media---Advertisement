<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(128, 128, 128, 0.1)" stroke-width="0.5"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="rgba(128, 128, 128, 0.2)"/>
    </pattern>
    <pattern id="diagonals" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 20 L 20 0" stroke="rgba(128, 128, 128, 0.1)" stroke-width="0.5" fill="none"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect width="100%" height="100%" fill="url(#dots)"/>
  <rect width="100%" height="100%" fill="url(#diagonals)"/>
</svg>
