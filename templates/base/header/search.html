<form action="{% url 'search' %}" method="get" class="search-component" role="search" x-data="{ open: false }" @click.away="open = false" @keydown.escape="open = false">
    <label for="site-search" class="sr-only">Search articles and magazines</label>
    <input type="search" id="site-search" name="q" class="search-input" placeholder="Search…" autocomplete="off"
           @focus="open = true" @input="open = true"
           hx-get="{% url 'search:suggestions' %}" hx-trigger="keyup changed delay:300ms" hx-target="#search-suggestions" hx-indicator="#search-loading">
    <button type="submit" class="search-icon" aria-label="Search">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    </button>
    <span id="search-loading" class="search-loading htmx-indicator" aria-hidden="true">
        <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
    </span>
    <div id="search-suggestions" class="search-suggestions" x-show="open" x-cloak></div>
</form>
