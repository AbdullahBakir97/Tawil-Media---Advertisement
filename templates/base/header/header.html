{% load static i18n %}
<header class="site-header{% if show_hero %} site-header--hero{% endif %}">
    <div class="header-background" aria-hidden="true">
        <img src="{% static 'img/almadina-background.jpg' %}" alt="" data-hero-bg>
    </div>

    <div class="header-nav-row">
        <div class="container header-nav-inner">
            <a href="{% url 'home' %}" class="header-brand" aria-label="{% blocktrans %}{{ SITE_NAME }} home{% endblocktrans %}">
                <img src="{% static 'img/tawillogo.png' %}" alt="" class="header-brand-logo">
                <span class="header-brand-name">{{ SITE_NAME }}</span>
            </a>
            {% include "base/header/navigation.html" %}
            <div class="header-tools">
                {% include "base/header/search.html" %}
                {% include "base/header/user-menu.html" %}
            </div>
        </div>
    </div>

    {% if show_hero %}{% include "base/hero/front-page.html" %}{% endif %}
</header>
