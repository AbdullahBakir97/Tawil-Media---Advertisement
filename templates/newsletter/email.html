{% load i18n %}<!doctype html>
<html lang="{{ issue.language }}" dir="{% if issue.language == 'ar' %}rtl{% else %}ltr{% endif %}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ issue.subject }}</title>
</head>
{% comment %}
An e-mail, not a web page: tables for layout and styles on the elements
themselves, because most mail clients strip <style> and ignore flex and grid.
Colours are the brand's, written out rather than taken from CSS variables,
which no mail client resolves.
{% endcomment %}
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Helvetica,Arial,sans-serif;color:#1c2733;">
{% if issue.preheader %}<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ issue.preheader }}</div>{% endif %}

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;">
<tr><td align="center" style="padding:24px 12px;">

<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:100%;background:#ffffff;border-radius:12px;overflow:hidden;">

  <tr><td style="background:#0b2545;padding:24px 28px;">
    <div style="font-size:20px;font-weight:bold;color:#ffffff;letter-spacing:0.02em;">{{ SITE_NAME }}</div>
    {% if issue.preheader %}<div style="margin-top:4px;font-size:13px;color:#f2b25c;">{{ issue.preheader }}</div>{% endif %}
  </td></tr>

  {% if issue.intro %}
  <tr><td style="padding:28px 28px 8px;">
    <div style="font-size:16px;line-height:1.6;color:#1c2733;">{{ issue.intro|linebreaksbr }}</div>
  </td></tr>
  {% endif %}

  {% for block in blocks %}
  <tr><td style="padding:16px 28px;">
    {% if block.kind == "lead" %}
      <div style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#b07d2e;">{% trans "Lead story" %}</div>
      <h1 style="margin:6px 0 8px;font-size:24px;line-height:1.25;color:#0b2545;">
        <a href="{{ block.url }}" style="color:#0b2545;text-decoration:none;">{{ block.title }}</a>
      </h1>
      {% if block.text %}<p style="margin:0 0 12px;font-size:15px;line-height:1.6;color:#44525f;">{{ block.text }}</p>{% endif %}
      <a href="{{ block.url }}" style="display:inline-block;padding:10px 18px;background:#0284c7;color:#ffffff;font-size:14px;font-weight:bold;text-decoration:none;border-radius:6px;">{% trans "Read the story" %}</a>

    {% elif block.kind == "ad" %}
      <div style="font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8a97a3;">{% trans "Advertisement" %}</div>
      <a href="{{ block.url }}" style="display:block;margin-top:6px;">
        {% if block.image %}<img src="{{ block.image }}" alt="{{ block.title }}" width="544" style="width:100%;max-width:544px;height:auto;display:block;border:0;border-radius:8px;">
        {% else %}<span style="color:#0284c7;font-size:15px;">{{ block.title }}</span>{% endif %}
      </a>

    {% elif block.kind == "text" %}
      {% if block.title %}<h2 style="margin:0 0 6px;font-size:18px;color:#0b2545;">{{ block.title }}</h2>{% endif %}
      {% if block.text %}<p style="margin:0;font-size:15px;line-height:1.6;color:#44525f;">{{ block.text|linebreaksbr }}</p>{% endif %}

    {% else %}
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td style="vertical-align:top;">
          <div style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#b07d2e;">{{ block.label }}</div>
          <h2 style="margin:5px 0 6px;font-size:18px;line-height:1.3;color:#0b2545;">
            <a href="{{ block.url }}" style="color:#0b2545;text-decoration:none;">{{ block.title }}</a>
          </h2>
          {% if block.meta %}<div style="margin-bottom:6px;font-size:13px;color:#8a97a3;">{{ block.meta }}</div>{% endif %}
          {% if block.text %}<p style="margin:0;font-size:14px;line-height:1.6;color:#44525f;">{{ block.text }}</p>{% endif %}
        </td>
        {% if block.image %}
        <td width="120" style="vertical-align:top;padding-inline-start:16px;">
          <a href="{{ block.url }}"><img src="{{ block.image }}" alt="" width="120" style="width:120px;height:auto;display:block;border:0;border-radius:6px;"></a>
        </td>
        {% endif %}
      </tr>
      </table>
    {% endif %}
  </td></tr>
  {% if not forloop.last %}<tr><td style="padding:0 28px;"><hr style="border:0;border-top:1px solid #e6eaee;margin:0;"></td></tr>{% endif %}
  {% endfor %}

  <tr><td style="padding:24px 28px 28px;background:#f8fafb;border-top:1px solid #e6eaee;">
    <div style="font-size:13px;line-height:1.6;color:#8a97a3;">
      {% blocktrans %}You are receiving this because you subscribed to the {{ SITE_NAME }} newsletter.{% endblocktrans %}
      <br>
      <a href="{{ unsubscribe_url }}" style="color:#0284c7;">{% trans "Unsubscribe" %}</a>
      &nbsp;·&nbsp;
      <a href="{{ site_url }}" style="color:#0284c7;">{{ SITE_NAME }}</a>
    </div>
  </td></tr>

</table>

</td></tr>
</table>
</body>
</html>
