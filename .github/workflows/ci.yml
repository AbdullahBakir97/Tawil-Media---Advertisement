name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Lint, checks & tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      DEBUG: '0'
      SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdefghijklmnopqrstuvwxyz
      ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Django system checks
        run: python manage.py check --deploy --fail-level WARNING
      - name: Migrations are in sync with models
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        env:
          SECURE_SSL_REDIRECT: '0'  # the test client speaks plain HTTP
        run: python manage.py test --noinput

  frontend:
    name: Build CSS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - name: Compiled CSS is committed and up to date
        run: git diff --exit-code -- static/css/dist/main.css
